# NetraSaathi interview question bank, v0.
# Owned by the clinical lead. The brain reads this file; no question text or
# skip rule lives in code.
#
# Question wording comes from the Build spec (romanised Hindi).
# Option labels marked "draft" were written by the dev team and need the
# clinical lead's approval before the pilot.
#
# Field guide
#   id        unique id, also used in the case record's answers[].q
#   text_hi   what the app says and shows to the customer
#   type      yes_no | choice | multi | number
#   options   tap answers (value = what the brain stores, label_hi = what the customer sees)
#   none_value  for multi: the option that means "none of these" (cannot be combined)
#   min/max   for number questions
#   fills     where the answer goes in the case record (see src/brain/apply.ts)
#   ask_if    condition; the question is skipped when it is false
#   danger    which answer values are danger signs (stop + Red). For multi the
#             value itself is recorded; for yes_no, danger_code is recorded.
#   readback  true = a key answer: a VOICE answer is always read back for a yes/no
#             before it is saved (dev proposal for the key list; clinical lead to confirm).
#             Any voice answer with low confidence or danger words heard is read back too.
#             A voice answer that is itself a danger sign is never read back: it stops at once.
#   unit_hi   word said after a number in the read-back (e.g. "52 saal")

version: 0
draft_labels: true

questions:
  - id: consent
    text_hi: "Kya hum aapki awaaz record kar sakte hain? Haan ya na?"
    type: yes_no
    fills: { path: consent.given }

  - id: main_problem
    text_hi: "Aankhon mein kya pareshani hai?"
    type: multi
    readback: true
    none_value: none
    options:
      - { value: near_blur, label_hi: "Paas ka dhundhla dikhta hai" }
      - { value: far_blur, label_hi: "Door ka dhundhla dikhta hai" }
      - { value: eye_strain, label_hi: "Aankh thakti hai ya sir dard" }
      - { value: watering_burning, label_hi: "Paani aana ya jalan" }
      - { value: none, label_hi: "Koi pareshani nahin" }
    fills: { path: symptoms, mode: add_all }

  - id: danger_signs
    text_hi: "Achanak kam dikhna, bijli chamakna, aankh mein dard ya laali?"
    type: multi
    readback: true
    none_value: none
    options:
      - { value: sudden_vision_loss, label_hi: "Achanak kam dikhna" }
      - { value: flashes_or_curtain, label_hi: "Bijli chamakna ya parda sa aana" }
      - { value: painful_red_eye, label_hi: "Aankh mein dard ya laali" }
      - { value: halos_with_headache, label_hi: "Roshni ke ghere aur sir dard" }
      - { value: injury_or_chemical, label_hi: "Chot lagi ya kuch chala gaya (jaise chuna)" }
      - { value: none, label_hi: "Inmein se kuch nahin" }
    # Each chosen danger value is added to danger_signs; any one stops the interview.
    danger: [sudden_vision_loss, flashes_or_curtain, painful_red_eye, halos_with_headache, injury_or_chemical]
    fills: { path: answers_only }

  - id: age
    text_hi: "Aapki umar kitni hai?"
    type: number
    readback: true
    unit_hi: saal
    min: 5
    max: 110
    fills: { path: person.age }

  - id: occupation
    text_hi: "Aap kya kaam karte hain?"
    type: choice
    readback: true
    options:
      - { value: tailor, label_hi: "Silai / darzi" }
      - { value: shopkeeper, label_hi: "Dukaan" }
      - { value: driver, label_hi: "Gaadi chalana" }
      - { value: farmer, label_hi: "Kheti" }
      - { value: labourer, label_hi: "Mazdoori" }
      - { value: office_worker, label_hi: "Office / computer" }
      - { value: goldsmith_or_repair, label_hi: "Sunar / mobile repair" }
      - { value: homemaker, label_hi: "Ghar ka kaam" }
      - { value: student, label_hi: "Padhai" }
      - { value: other, label_hi: "Kuch aur" }
    fills: { path: person.occupation }

  # Adapt rule: under 40 with no near complaint skips the reading-glasses block.
  - id: near_work
    text_hi: "Kaam ki cheez kitni paas rakhte hain? Phone ko waise pakadiye."
    type: choice
    readback: true
    note: "Step 1 records hours only. The camera measures working distance in M2."
    options:
      - { value: 0, label_hi: "Paas ka kaam nahin" }
      - { value: 2, label_hi: "Lagbhag 2 ghante" }
      - { value: 4, label_hi: "Lagbhag 4 ghante" }
      - { value: 6, label_hi: "Lagbhag 6 ghante" }
      - { value: 8, label_hi: "8 ghante ya zyada" }
    ask_if: { any: [ { field: person.age, op: ">=", value: 40 }, { field: symptoms, op: includes, value: near_blur } ] }
    fills: { path: tasks.near.hours, mode: add }

  - id: phone_reading
    text_hi: "Phone par kya karte hain: WhatsApp, video, padhna?"
    type: choice
    readback: true
    options:
      - { value: 0, label_hi: "Phone kam chalate hain" }
      - { value: 1, label_hi: "Lagbhag 1 ghanta" }
      - { value: 2, label_hi: "Lagbhag 2 ghante" }
      - { value: 4, label_hi: "4 ghante ya zyada" }
    ask_if: { any: [ { field: person.age, op: ">=", value: 40 }, { field: symptoms, op: includes, value: near_blur } ] }
    fills: { path: tasks.near.hours, mode: add }

  - id: far_vision
    text_hi: "Bus ka number, TV, sadak paar chehre saaf dikhte hain?"
    type: yes_no
    # "no" adds far_blur to symptoms (if not already there)
    fills: { path: symptoms, mode: add_if_no, value: far_blur }

  - id: driving
    text_hi: "Gaadi chalate hain? Raat ko bhi?"
    type: choice
    options:
      - { value: no, label_hi: "Nahin chalate" }
      - { value: day, label_hi: "Sirf din mein" }
      - { value: night, label_hi: "Raat ko bhi" }
    fills: { path: answers_only }

  # Adapt rule: a farmer or outdoor worker gets the sun question.
  - id: sun
    text_hi: "Din mein kitni der dhoop mein rehte hain?"
    type: choice
    options:
      - { value: 1, label_hi: "1 ghante se kam" }
      - { value: 3, label_hi: "Lagbhag 3 ghante" }
      - { value: 6, label_hi: "6 ghante ya zyada" }
    ask_if: { field: person.occupation, op: in, value: [farmer, labourer, driver] }
    fills: { path: answers_only }

  - id: current_glasses
    text_hi: "Chashma pehante hain? Apna hai ya kisi aur ka? Kab banwaya?"
    type: choice
    options:
      - { value: none, label_hi: "Chashma nahin pehante" }
      - { value: own, label_hi: "Apna chashma" }
      - { value: someone_else, label_hi: "Kisi aur ka chashma" }
    fills: { path: answers_only }

  - id: health
    text_hi: "Sugar, BP, TB ki dawai? Aankh mein koi dawai daalte hain?"
    type: multi
    readback: true
    none_value: none
    options:
      - { value: diabetes, label_hi: "Sugar" }
      - { value: tb_medicine, label_hi: "TB ki dawai" }
      - { value: steroid_drops, label_hi: "Aankh mein dawai daalte hain" }
      - { value: none, label_hi: "Inmein se kuch nahin" }
    note: "BP is in the wording but the case record has no BP field yet (open question)."
    fills: { path: risks, mode: set_flags }

  # Adapt rule: a yes to sugar leads to "has your vision changed recently?"
  # Triage rule: diabetes OR TB medicine with a recent vision change is Red.
  - id: recent_change
    text_hi: "Kya haal mein aapki nazar badli hai?"
    type: yes_no
    readback: true
    ask_if: { any: [ { field: risks.diabetes, op: "==", value: true }, { field: risks.tb_medicine, op: "==", value: true } ] }
    danger: [yes]
    danger_code: recent_change_on_medicine_or_diabetes
    fills: { path: answers_only }

  - id: eye_history
    text_hi: "Aankh ka operation ya chot?"
    type: multi
    readback: true
    none_value: none
    options:
      - { value: eye_surgery, label_hi: "Operation hua hai" }
      - { value: injury, label_hi: "Pehle chot lagi thi" }
      - { value: none, label_hi: "Kuch nahin" }
    fills: { path: risks, mode: set_flags }

  # Lens rule: 60+ and walks on field bunds or stairs -> separate readers, not bifocals.
  - id: walking
    text_hi: "Khet ki mendh ya seedhi par chalna hota hai?"
    type: yes_no
    readback: true
    ask_if: { field: person.age, op: ">=", value: 60 }
    fills: { path: answers_only }

  - id: budget
    text_hi: "Chashme par kitna kharch theek rahega?"
    type: choice
    options:
      - { value: low, label_hi: "Kam" }
      - { value: medium, label_hi: "Beech ka" }
      - { value: high, label_hi: "Zyada" }
    fills: { path: answers_only }
